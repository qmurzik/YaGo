plugins {
    id 'com.android.application'
}

android {
    namespace 'com.qmurzik.yago'
    compileSdk 34

    defaultConfig {
        applicationId 'com.qmurzik.yago'
        minSdk 27
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        release {
            minifyEnabled false
            // Подписываем debug-ключом, чтобы релизный APK сразу ставился.
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {
    compileOnly 'de.robv.android.xposed:api:82'
}
